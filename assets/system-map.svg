<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">GitHub Issues system map</title><desc id="desc">A skill-specific pipeline diagram showing the operating components for GitHub Issues.</desc>
<rect width="1200" height="660" rx="26" fill="#F8FAFC"/><rect width="1200" height="14" rx="7" fill="#B42318"/>
<style>text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
<text x="54" y="62" font-size="14" font-weight="750" fill="#B42318" text-anchor="start"><tspan x="54" dy="0">PIPELINE SYSTEM MAP</tspan></text><text x="54" y="110" font-size="31" font-weight="760" fill="#0F172A" text-anchor="start"><tspan x="54" dy="0">GitHub Issues</tspan></text><rect x="44" y="155" width="1112" height="475" rx="22" fill="#FEF3F2" stroke="#FEE4E2"/><rect x="70" y="315" width="180" height="105" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="100" cy="345" r="18" fill="#FEE4E2"/><text x="100" y="351" text-anchor="middle" font-size="17" font-weight="750" fill="#B42318">1</text><text x="128" y="350" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="128" dy="0">Issue</tspan><tspan x="128" dy="23">request</tspan></text><path d="M250 367 L278 367" stroke="#B42318" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="285" y="315" width="180" height="105" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="315" cy="345" r="18" fill="#FEE4E2"/><text x="315" y="351" text-anchor="middle" font-size="17" font-weight="750" fill="#B42318">2</text><text x="343" y="350" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="343" dy="0">Repository</tspan><tspan x="343" dy="23">and labels</tspan></text><path d="M465 367 L493 367" stroke="#B42318" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="500" y="315" width="180" height="105" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="530" cy="345" r="18" fill="#FEE4E2"/><text x="530" y="351" text-anchor="middle" font-size="17" font-weight="750" fill="#B42318">3</text><text x="558" y="350" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="558" dy="0">Issue draft</tspan></text><path d="M680 367 L708 367" stroke="#B42318" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="715" y="315" width="180" height="105" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="745" cy="345" r="18" fill="#FEE4E2"/><text x="745" y="351" text-anchor="middle" font-size="17" font-weight="750" fill="#B42318">4</text><text x="773" y="350" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="773" dy="0">GitHub API</tspan><tspan x="773" dy="23">or gh</tspan></text><path d="M895 367 L923 367" stroke="#B42318" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="930" y="315" width="180" height="105" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="960" cy="345" r="18" fill="#FEE4E2"/><text x="960" y="351" text-anchor="middle" font-size="17" font-weight="750" fill="#B42318">5</text><text x="988" y="350" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="988" dy="0">Created</tspan><tspan x="988" dy="23">issue</tspan><tspan x="988" dy="23">verification</tspan></text><text x="70" y="284" font-size="13" font-weight="750" fill="#B42318" text-anchor="start"><tspan x="70" dy="0">INPUT</tspan></text><text x="930" y="284" font-size="13" font-weight="750" fill="#B42318" text-anchor="start"><tspan x="930" dy="0">VERIFIED OUTPUT</tspan></text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#B42318"/></marker></defs></svg>